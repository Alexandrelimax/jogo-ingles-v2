<div class="home">
  <div class="scanlines"></div>

  <header class="home__header">
    <div class="home__logo" [class.glitch]="glitchActive" data-text="ENGLISH QUEST">
      ENGLISH QUEST
    </div>
    <p class="home__tagline">— TREINE SEU INGLÊS —</p>
  </header>

  <main class="home__main">
    <div class="home__card">
      <div class="home__features">

        <div class="feature">
          <span class="feature__icon">
            <!-- Controller pixel icon -->
            <svg viewBox="0 0 20 13" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="28" height="18">
              <rect x="1" y="2" width="18" height="9" fill="#C84800"/>
              <rect x="0" y="4" width="3" height="5" fill="#C84800"/>
              <rect x="17" y="4" width="3" height="5" fill="#C84800"/>
              <rect x="4" y="4" width="2" height="5" fill="#FFFEF0"/>
              <rect x="3" y="6" width="4" height="2" fill="#FFFEF0"/>
              <rect x="14" y="4" width="3" height="3" fill="#E83020"/>
              <rect x="11" y="6" width="3" height="3" fill="#3858F0"/>
              <rect x="14" y="7" width="3" height="2" fill="#18A018"/>
              <rect x="8" y="5" width="2" height="2" fill="#181008" opacity="0.35"/>
              <rect x="11" y="5" width="2" height="2" fill="#181008" opacity="0.35"/>
            </svg>
          </span>
          <span>5 modos de jogo</span>
        </div>

        <div class="feature">
          <span class="feature__icon">
            <!-- Lightning bolt pixel icon -->
            <svg viewBox="0 0 10 18" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="18" height="28">
              <rect x="6" y="0" width="4" height="2" fill="#F8C020"/>
              <rect x="4" y="2" width="4" height="2" fill="#F8C020"/>
              <rect x="3" y="4" width="4" height="2" fill="#F8C020"/>
              <rect x="1" y="6" width="8" height="2" fill="#F8C020"/>
              <rect x="3" y="8" width="5" height="2" fill="#F8C020"/>
              <rect x="2" y="10" width="4" height="2" fill="#F8C020"/>
              <rect x="1" y="12" width="4" height="2" fill="#F8C020"/>
              <rect x="1" y="14" width="3" height="2" fill="#F8C020"/>
              <rect x="2" y="16" width="2" height="2" fill="#F8C020"/>
            </svg>
          </span>
          <span>Streak multiplier x5</span>
        </div>

        <div class="feature">
          <span class="feature__icon">
            <!-- Book pixel icon -->
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="28" height="28">
              <rect x="0" y="0" width="15" height="16" fill="#E83020"/>
              <rect x="0" y="0" width="3" height="16" fill="#C82018"/>
              <rect x="4" y="3"  width="10" height="2" fill="#FFFEF0"/>
              <rect x="4" y="7"  width="9"  height="2" fill="#FFFEF0"/>
              <rect x="4" y="11" width="10" height="2" fill="#FFFEF0"/>
            </svg>
          </span>
          <span>Explicações detalhadas</span>
        </div>

        <div class="feature">
          <span class="feature__icon">
            <!-- Trophy pixel icon -->
            <svg viewBox="0 0 16 18" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" width="28" height="32">
              <rect x="2"  y="0"  width="12" height="2"  fill="#F8C020"/>
              <rect x="1"  y="2"  width="14" height="7"  fill="#F8C020"/>
              <rect x="2"  y="9"  width="12" height="2"  fill="#F8C020"/>
              <rect x="0"  y="2"  width="1"  height="7"  fill="#F8C020"/>
              <rect x="15" y="2"  width="1"  height="7"  fill="#F8C020"/>
              <rect x="6"  y="11" width="4"  height="4"  fill="#F8C020"/>
              <rect x="3"  y="15" width="10" height="3"  fill="#F8C020"/>
              <rect x="6"  y="3"  width="4"  height="4"  fill="#D0A010"/>
              <rect x="5"  y="4"  width="6"  height="2"  fill="#D0A010"/>
            </svg>
          </span>
          <span>Sistema de XP e níveis</span>
        </div>

      </div>

      @if (bestScore > 0) {
        <div class="home__best-score">
          <span class="label">MELHOR SCORE</span>
          <span class="value neon-text">{{ bestScore }}</span>
        </div>
      }

      <button class="home__start-btn" (click)="start()">
        ▶ INICIAR MISSÃO
      </button>
    </div>
  </main>

  <footer class="home__footer">
    <span>por <span class="neon-text">Alexandre Lima</span></span>
  </footer>
</div>
