<div class="mode-select">
  <div class="scanlines"></div>

  <header class="mode-select__header">
    <h1 class="mode-select__title">SELECT MODE</h1>
    <p class="mode-select__sub">— ESCOLHA SEU DESAFIO —</p>
  </header>

  <div class="mode-select__grid">
    @for (mode of modes; track mode.id) {
      <button
        class="mode-card"
        [attr.data-mode]="mode.id"
        (click)="select(mode)">

        <span class="mode-card__icon">
          <app-mode-icon [modeId]="mode.id" />
        </span>

        <span class="mode-card__label">{{ mode.label }}</span>
        <span class="mode-card__desc">{{ mode.description }}</span>
      </button>
    }
  </div>

  <button class="mode-select__back" (click)="goBack()">◀ VOLTAR</button>
</div>
